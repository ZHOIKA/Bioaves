name: Build BioAves APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build APK
        run: |
          gradle :app:assembleDebug
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/BioAves.apk

      - name: Upload BioAves APK
        uses: actions/upload-artifact@v4
        with:
          name: BioAves
          path: dist/BioAves.apk
          if-no-files-found: error

      - name: Publish direct-download APK
        run: |
          mkdir -p downloads
          cp dist/BioAves.apk downloads/BioAves.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloads/BioAves.apk
          if git diff --cached --quiet; then
            echo "APK already up to date"
            exit 0
          fi
          git commit -m "Update BioAves APK download"
          git push
